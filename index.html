<!DOCTYPE html>
<style>
    button{
        margin:15px 15px 15px 0;
        border-radius: 15px;
        color: Ivory;
        background-color: gainSboro;
    }
    body{
        background-color: cornSilk;
    }
    input{
        background-color: lavender;
    }
    p{
        border: double aqua;
        width: 300px;
    }
    canvas{
        background-color: #ff972782;
        margin:0px 0px 0px 180px;
    }
    #Circle{
        width:200px;
        height:200px;
        border-radius: 50%;
        background: floralwhite;
    }
    #quadrato{
        width: 200px;
        height: 200px;
        background: azure;
    }
    #rettangolo{
        width: 300px;
        height: 150px;
        background: aqua;
    }
</style>
<h1>Calcolatore di aree e perimetri</h1>
<h2>Quale figura scegli?</h2>
<input readonly="true" placeholder="Inserisci altezza" hidden type="number"><br>
<button onclick="console_figure('quadrato')">Quadrato</button>
<button onclick="console_figure('rettangolo')">Rettangolo</button>
<button onclick="console_figure('triangolo_isoscele')">Triangolo isoscele</button>
<button onclick="console_figure('triangolo_rettangolo')">Triangolo rettangolo</button>
<button onclick="console_figure('triangoloRettangoloIsoscele')">Triangolo rettangolo isoscele</button>
<button onclick="console_figure('cerchio')">Cerchio/circonferenza</button><br>
<section>
<div><input readonly="true" type="number"></div><br>
<div><input readonly="true" placeholder="Area"></div><br>
<input readonly="true" placeholder="Perimetro"><span hidden><p></p></span><br>
<button hidden id="trum" onclick="calculate()">Calcola</button>
<div id="Circle" hidden></div>
<div hidden id="quadrato"></div>
<div hidden id="rettangolo"></div>
</section>
<script>
lato=0
base=0
altezza=0
raggio=0
figura_=""
latoIsoscele=0
input2=document.querySelectorAll("input")[0]
input=document.querySelectorAll("input")[1]
area=document.querySelectorAll("input")[2]
perimetro=document.querySelectorAll("input")[3]
buttonQ=document.querySelectorAll("button")[0]
buttonR=document.querySelectorAll("button")[1]
buttonTI=document.querySelectorAll("button")[2]
buttonTR=document.querySelectorAll("button")[3]
buttonTRI=document.querySelectorAll("button")[4]
buttonC=document.querySelectorAll("button")[5]
buttonCALCOLO=document.getElementById("trum")
function disable() {
	//aggiungi che tolga solo il bottone della figura scelta
	//così,puoi cambiare da una figura all'altra senza dover chiudere e riaprire
	// e senza dover metterci un tasto che ti riporta indietro
	document.querySelector("h2").remove()
	buttonQ.hidden=true
	buttonR.hidden=true
	buttonTI.hidden=true
	buttonTR.hidden=true
	buttonTRI.hidden=true
	buttonC.hidden=true
	buttonCALCOLO.hidden=false
}
function console_figure(figura) {
	figura_=figura
	disable()
	input.readOnly=false
	if(figura==="quadrato") {
	input.placeholder="Inserisci lato"
	input.addEventListener("input",()=>lato=input.value)
	div=document.getElementById("quadrato")
	div.hidden=false
	}
	else if(figura==="cerchio") {
	input.placeholder="Inserisci raggio"
	area.placeholder="Cerchio"
	perimetro.placeholder="Circonferenza"
	input.addEventListener("input",()=>raggio=input.value)
    div=document.getElementById("Circle")
    div.hidden=false
	}
    else{
        input2.hidden=false
        input2.readOnly=false
        input.placeholder="Inserisici base"
        if (figura==="rettangolo" || figura==="triangolo_isoscele"){
            input.addEventListener("input",()=>base=input.value)
            input2.addEventListener("input",()=>altezza=input2.value)
            if(figura==="rettangolo"){
                div=document.getElementById("rettangolo")
                div.hidden=false
            }
        }
        else if(figura_==="triangolo_rettangolo" || figura_==="triangoloRettangoloIsoscele"){
                input2.placeholder="Inserisci ipotenusa"
                input.placeholder="Inserisci cateto"
                input.addEventListener("input",()=>base=input.value)
                input2.addEventListener("input",()=>altezza=input2.value)
        }  
    }
}
function calculate() {
	if(figura_==="quadrato") {
    area.value=`L'area misura ${lato**2} cm²`
    perimetro.value=`Il perimetro misura ${lato*4} cm`
	}
	else if(figura_==="cerchio"){
	    raggio=input.value
	    area.value=`Il cerchio misura ${raggio**2*Math.PI}`
	    perimetro.value=`La circonferenza misura ${raggio*2*Math.PI}`
	}
	else{ 
	    base=input.value
	    altezza=input2.value
	    if(figura_==="rettangolo"){
	        area.value=`L'area misura ${base*altezza} cm²`
	        perimetro.value=`Il perimetro misura ${base*2+altezza*2} cm`
	    }
	    else if(figura_==="triangolo_isoscele"){
	        area.value=`L'area misura ${base*altezza/2} cm²`
	        latoObliquo=[altezza**2-(base/2)**2]**0.5
	        perimetro.value=`Il perimetro misura ${latoObliquo*2+base} cm`
	        document.querySelector("span").hidden=false
	        document.querySelector("p").innerHTML=`Il lato obliquo misura ${latoObliquo} cm`
	    }
	    else if(figura_==="triangolo_rettangolo"){
	          ipotenusa=parseFloat(altezza)
	          cateto=parseFloat(base)
	          cateto2=(ipotenusa*ipotenusa-cateto*cateto)**0.5
	          area.value=`L'area misura ${cateto*cateto2/2} cm²`
	          perimetro.value=`Il perimetro misura ${ipotenusa+cateto+cateto2} cm`
	          document.querySelector("p").innerHTML=`L'altro cateto misura ${cateto2} cm` 
	          document.querySelector("span").hidden=false
	    }
	    else if(figura_==="triangoloRettangoloIsoscele"){
	        ipotenusa=parseFloat(altezza)
	        cateto=parseFloat(base)
	        area.value=`L'area misura ${cateto**2/2} cm²`
	        perimetro.value=`Il perimetro misura ${ipotenusa+cateto*2} cm`
	    }
	    
	}
}
</script>
