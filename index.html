<!DOCTYPE html>
<style>
    button{
        margin:15px 15px 15px 0;
        border-radius: 15px;
        color: Ivory;
        background-color: gainSboro;
    }
    body{
        background-color: cornSilk;
    }
    input{
        background-color: lavender;
    }
    p{
        border: double aqua;
        width: 300px;
    }
    #Circle{
        width:200px;
        height:200px;
        border-radius: 50%;
        background: steelblue;
    }
    #quadrato{
        width: 200px;
        height: 200px;
        background: darkseagreen;
    }
    #rettangolo{
        width: 300px;
        height: 150px;
        background: aqua;
    }
    #triangolo_isoscele{
    width: 0;
    height: 0;
    border-left: 100px solid transparent;
    border-right: 100px solid transparent;
    border-bottom: 200px solid indianred;
    }
    #triangolo_rettangolo{
        width: 0;
        height: 0;
        border-left: 0px solid;
        border-right: 150px solid transparent;
        border-bottom: 200px solid khaki;
    }
    #triangoloRettangoloIsoscele{
        width: 0;
        height: 0;
        border-left: 0px solid;
        border-right: 150px solid transparent;
        border-bottom: 150px solid darkcyan;
    }
    #triangoloEquilatero{
        width: 0;
        height: 0;
        border: 150px solid transparent;
        border-bottom: 150px solid lime;
        border-top: none;
    }
</style>
<h1>Calcolatore di aree e perimetri</h1>
<h2>Quale figura scegli?</h2>
<input readonly="true" placeholder="Inserisci altezza" hidden type="number"><br>
<button onclick="console_figure('quadrato')" id="q">Quadrato</button>
<button onclick="console_figure('rettangolo')" id="r">Rettangolo</button>
<button onclick="console_figure('triangolo_isoscele')" id="ti">Triangolo isoscele</button>
<button onclick="console_figure('triangolo_rettangolo')" id="tr">Triangolo rettangolo</button>
<button onclick="console_figure('triangoloRettangoloIsoscele')" id="tri">Triangolo rettangolo isoscele</button>
<button onclick="console_figure('triangoloEquilatero')" id="te">Triangolo equilatero</button>
<button onclick="console_figure('cerchio')" id="c">Cerchio/circonferenza</button><br>
<div><input readonly="true" type="number"></div><br>
<div><input readonly="true" placeholder="Area"></div><br>
<input readonly="true" placeholder="Perimetro"><span hidden><p></p></span><br>
<button hidden id="trum" onclick="calculate()">Calcola</button><br>
<div id="Circle" hidden></div>
<div hidden id="quadrato"></div>
<div hidden id="rettangolo"></div>
<div id="triangolo_isoscele" hidden></div>
<div id="triangolo_rettangolo" hidden></div>
<div hidden id="triangoloRettangoloIsoscele"></div>
<div id="triangoloEquilatero" hidden></div>
<script>
lato=0
base=0
altezza=0
raggio=0
figura_=""
latoIsoscele=0
input2=document.querySelectorAll("input")[0]
input=document.querySelectorAll("input")[1]
area=document.querySelectorAll("input")[2]
perimetro=document.querySelectorAll("input")[3]
buttonCALCOLO=document.getElementById("trum")
function disable() {
	document.querySelector("h2").remove()
	document.getElementById("q").remove()
    document.getElementById("r").remove()
    document.getElementById("ti").remove()
    document.getElementById("tr").remove()
    document.getElementById("tri").remove()
    document.getElementById("te").remove()
    document.getElementById("c").remove()
	buttonCALCOLO.hidden=false
}
function console_figure(figura) {
	figura_=figura
	disable()
	input.readOnly=false
	if(figura==="quadrato") {
	input.placeholder="Inserisci lato"
	input.addEventListener("input",()=>lato=input.value)
	document.getElementById("quadrato").hidden=false
	}
	else if(figura==="cerchio") {
	input.placeholder="Inserisci raggio"
	area.placeholder="Cerchio"
	perimetro.placeholder="Circonferenza"
	input.addEventListener("input",()=>raggio=input.value)
    document.getElementById("Circle").hidden=false
	}
    else{
        input2.hidden=false
        input2.readOnly=false
        input.placeholder="Inserisici base"
        if (figura==="rettangolo" || figura==="triangolo_isoscele"){
            input.addEventListener("input",()=>base=input.value)
            input2.addEventListener("input",()=>altezza=input2.value)
            if(figura==="rettangolo"){
                document.getElementById("rettangolo").hidden=false
            }
            if(figura==="triangolo_isoscele"){
                document.getElementById("triangolo_isoscele").hidden=false
            }
        }
        else if(figura==="triangolo_rettangolo" || figura_==="triangoloRettangoloIsoscele"){
                input2.placeholder="Inserisci ipotenusa"
                input.placeholder="Inserisci cateto"
                input.addEventListener("input",()=>base=input.value)
                input2.addEventListener("input",()=>altezza=input2.value)
                if(figura==="triangolo_rettangolo"){
                    document.getElementById("triangolo_rettangolo").hidden=false
                }
                if(figura==="triangoloRettangoloIsoscele"){
                    document.getElementById("triangoloRettangoloIsoscele").hidden=false
                }
        }
        else if(figura==="triangoloEquilatero"){
            input2.placeholder="Inserisci altezza"
            input.placeholder="Inserisci lato"
            input.addEventListener("input",()=>base=input.value)
            input2.addEventListener("input",()=>altezza=input2.value)
            document.getElementById("triangoloEquilatero").hidden=false
        }
    }
}
function calculate() {
	if(figura_==="quadrato") {
    area.value=`L'area misura ${lato**2} cm²`
    perimetro.value=`Il perimetro misura ${lato*4} cm`
	}
	else if(figura_==="cerchio"){
	    raggio=input.value
	    area.value=`Il cerchio misura ${raggio**2*Math.PI}`
	    perimetro.value=`La circonferenza misura ${raggio*2*Math.PI}`
	}
	if(figura_==="rettangolo"){
	    area.value=`L'area misura ${base*altezza} cm²`
	    perimetro.value=`Il perimetro misura ${base*2+altezza*2} cm`
	}
	else if(figura_==="triangolo_isoscele"){
        area.value=`L'area misura ${base*altezza/2} cm²`
	    latoObliquo=[altezza**2+(base/2)**2]**0.5
	    perimetro.value=`Il perimetro misura ${latoObliquo*2+base} cm`
	    document.querySelector("span").hidden=false
	    document.querySelector("p").innerHTML=`Il lato obliquo misura ${latoObliquo} cm`
	 }
	 else if(figura_==="triangolo_rettangolo"){
	     ipotenusa=parseFloat(altezza)
	     cateto=parseFloat(base)
	     cateto2=(ipotenusa*ipotenusa-cateto*cateto)**0.5
	     area.value=`L'area misura ${cateto*cateto2/2} cm²`
	     perimetro.value=`Il perimetro misura ${ipotenusa+cateto+cateto2} cm`
	     document.querySelector("p").innerHTML=`L'altro cateto misura ${cateto2} cm` 
	     document.querySelector("span").hidden=false
	 }
	 else if(figura_==="triangoloRettangoloIsoscele"){
	     ipotenusa=parseFloat(altezza)
	     cateto=parseFloat(base)
	     area.value=`L'area misura ${cateto**2/2} cm²`
	     perimetro.value=`Il perimetro misura ${ipotenusa+cateto*2} cm`
	    }
	    else if(figura_==="triangoloEquilatero"){
	        area.value=`L'area misura ${base*altezza/2} cm2`
	        perimetro.value=`Il perimetro misura ${base*3} cm`
	    }
}
</script>
